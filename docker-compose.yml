version: '3.8'

services:
  # 1. React + Vite Frontend App
  frontend:
    build:
      context: ./apps/free-ai-playground
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # 2. FastAPI Enterprise AI Engineering Backend
  backend:
    build:
      context: ./apps/enterprise-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/enterprise_ai
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=enterprise-super-secret-key-32-chars-long-x98z
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # 3. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: enterprise_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
