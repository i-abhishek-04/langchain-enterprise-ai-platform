services:
  # 1. React + Vite Frontend App
  frontend:
    build:
      context: ./apps/free-ai-playground
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

  # 2. FastAPI Enterprise AI Engineering Backend
  backend:
    build:
      context: ./apps/enterprise-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./environment/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_CACHE_DIR=/root/.cache/fastembed
      - PORT=8000
    volumes:
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # 3. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./environment/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
  fastembed_cache:
